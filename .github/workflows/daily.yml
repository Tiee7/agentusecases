name: Daily usecase watch
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '0 = full catalog; 5 = fast smoke test'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Shanghai; GitHub scheduling may be delayed
permissions:
  contents: read
  actions: read
concurrency:
  group: daily-usecase-watch
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CASE_LIMIT: ${{ github.event.inputs.limit || '0' }}
      LISTING_URL: ${{ vars.LISTING_URL || 'https://agentusecases.ai/' }}
      CASE_ORDERING: ${{ vars.CASE_ORDERING || 'site_category_top' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Restore most recent successful history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous_run" ]; then
            mkdir -p data
            public_artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run/artifacts" --jq '.artifacts[] | select(.name == "usecase-history-public") | .id')
            if [ -n "$public_artifact" ]; then
              gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --name usecase-history-public --dir data
            fi
          fi
      - name: Collect snapshot and prepare next batch
        run: |
          set -euo pipefail
          python -m agentwatch.crawler --listing "$LISTING_URL" --ordering "$CASE_ORDERING" --limit "$CASE_LIMIT"
          python -m agentwatch.queue
          python -m agentwatch.digest
          cat data/daily-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Export publication-safe history
        run: python -m agentwatch.public_history
      - uses: actions/upload-artifact@v4
        with:
          name: usecase-history-public
          path: data/public-history/
          retention-days: 90
          if-no-files-found: error
  refresh_registry:
    needs: crawl
    runs-on: ubuntu-latest
    concurrency:
      group: case-research-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: usecase-history-public
          path: data/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh catalog, validate and publish against current main
        run: bash .github/scripts/publish-catalog.sh
