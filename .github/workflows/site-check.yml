name: Reading site checks
on:
  pull_request:
    paths: ['site/**', 'agentwatch/**', 'tests/**', 'schemas/**', 'registry/cases.json', 'research/*.json', 'reports/*.md', 'vercel.json', '.github/workflows/site-check.yml']
  push:
    branches: [main]
    paths: ['site/**', 'agentwatch/**', 'tests/**', 'schemas/**', 'registry/cases.json', 'research/*.json', 'reports/*.md', 'vercel.json', '.github/workflows/site-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix site ci --ignore-scripts
      - run: python -m unittest discover -s tests -q
      - run: npm --prefix site test
      - run: npm --prefix site run build
      - run: npm --prefix site run check:output
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm --prefix site run test:prompt-security
      - run: npm --prefix site run test:e2e
