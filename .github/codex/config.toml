# Trusted main-branch configuration. Research can edit only disposable data.
[permissions.business-research]
description = "Read public sources and write research drafts, never application files"

[permissions.business-research.filesystem]
":root" = "read"
":workspace_roots" = { "data" = "write" }
":tmpdir" = "write"
":slash_tmp" = "write"

[permissions.business-research.network]
enabled = true
